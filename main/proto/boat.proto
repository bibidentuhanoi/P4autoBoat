syntax = "proto3";
package boat;

message IMUData {
  float pitch   = 1;
  float roll    = 2;
  float heading = 3;
}

message ToFGrid {
  bool            valid         = 1;
  repeated int32  distances     = 2;  // 64*NB_TARGET values: zone*ntpp+target, row-major 8x8
  repeated uint32 sigma         = 3;  // range_sigma_mm per target (low=clean, high=edge)
  repeated uint32 target_status = 4;  // per-target validity code (5=valid, 9=valid+noisy)
  repeated uint32 nb_target_detected = 5;  // surfaces detected per zone, always 64 values
}

message Detection {
  int32 category = 1;
  float score    = 2;
  int32 x1       = 3;
  int32 y1       = 4;
  int32 x2       = 5;
  int32 y2       = 6;
}

message DetectCommand {
}

message SensorSnapshot {
  uint64  timestamp_us        = 1;
  IMUData imu                 = 2;
  ToFGrid tof_a               = 3;
  ToFGrid tof_b               = 4;
  repeated Detection detections = 5;
}

message MotorCommand {
  float throttle = 1;  // -1.0 to 1.0
  float rudder   = 2;  // -1.0 to 1.0
  float left     = 3;  // left motor -1.0 to 1.0
  float right    = 4;  // right motor -1.0 to 1.0
}

message MotorStatus {
  uint32 state          = 1;  // motor state enum
  float  left_throttle  = 2;  // current left throttle
  float  right_throttle = 3;  // current right throttle
}

message ArmCommand {
  bool arm = 1;  // true = arm, false = disarm
}

message SystemStatus {
  uint32 heap_free    = 1;
  int32  wifi_rssi    = 2;
  uint64 uptime_us    = 3;
}

// Envelope — every message on the wire is a BoatMessage
message BoatMessage {
  oneof payload {
    SensorSnapshot sensors      = 1;
    MotorCommand   motor        = 2;
    SystemStatus   status       = 3;
    DetectCommand  detect       = 4;
    // field 5 reserved for GpsCoordinate
    MotorStatus    motor_status = 6;
    ArmCommand     arm_cmd      = 7;
  }
}
