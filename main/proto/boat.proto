syntax = "proto3";
package boat;

message IMUData {
  float pitch   = 1;
  float roll    = 2;
  float heading = 3;
}

message ToFGrid {
  bool            valid         = 1;
  repeated int32  distances     = 2;  // 64*NB_TARGET values: zone*ntpp+target, row-major 8x8
  repeated uint32 sigma         = 3;  // range_sigma_mm per target (low=clean, high=edge)
  repeated uint32 target_status = 4;  // per-target validity code (5=valid, 9=valid+noisy)
  repeated uint32 nb_target_detected = 5;  // surfaces detected per zone, always 64 values
}

message Detection {
  int32 category = 1;
  float score    = 2;
  int32 x1       = 3;
  int32 y1       = 4;
  int32 x2       = 5;
  int32 y2       = 6;
}

message DetectCommand {
}

message GpsFix {
  bool   valid       = 1;
  double latitude    = 2;
  double longitude   = 3;
  float  altitude_m  = 4;
  float  speed_mps   = 5;
  float  course_deg  = 6;
  uint32 fix_quality = 7;
  uint32 satellites  = 8;
  float  hdop        = 9;
  uint64 utc_ms      = 10;
}

message GpsCoordinate {
  double latitude  = 1;
  double longitude = 2;
}

message SensorSnapshot {
  uint64  timestamp_us        = 1;
  IMUData imu                 = 2;
  ToFGrid tof_a               = 3;
  ToFGrid tof_b               = 4;
  repeated Detection detections = 5;
  GpsFix  gps                 = 6;
}

message MotorCommand {
  float throttle = 1;  // -1.0 to 1.0
  float rudder   = 2;  // -1.0 to 1.0
  float left     = 3;  // left motor -1.0 to 1.0
  float right    = 4;  // right motor -1.0 to 1.0
}

message WinchCommand {
  float speed = 1;  // -1..1 : + = CW/down (pay out), - = CCW/up (reel in), 0 = stop
}

message SteerCommand {
  float left  = 1;  // left rudder  : -1 = full left, +1 = full right, 0 = center
  float right = 2;  // right rudder : -1 = full left, +1 = full right, 0 = center
}

// Calibration-only: bypasses STEER_PULSE_MIN/NEUTRAL/MAX entirely, writes the
// MCPWM compare value directly so the operator can probe past the currently
// configured range to find a servo's true mechanical stop.
message SteerRawCommand {
  uint32 pulse_us = 1;
}

message MotorStatus {
  uint32 state          = 1;  // motor state enum
  float  left_throttle  = 2;  // current left throttle
  float  right_throttle = 3;  // current right throttle
  float  winch_speed    = 4;  // current winch speed (-1..1)
  bool   servo_power    = 5;  // servo rail (winch + rudders) actually powered
}

message ArmCommand {
  bool arm   = 1;  // true = arm, false = disarm
  bool force = 2;  // arm despite no GPS lock (manual bench/indoor override)
}

// Servo rail (pin 36) switch — independent of ESC arming so winch/rudders can
// be bench-tested without spinning up the thrusters. Arming still forces the
// rail on; disarming cuts it.
message ServoPowerCommand {
  bool on = 1;
}

message SystemStatus {
  uint32 heap_free    = 1;
  int32  wifi_rssi    = 2;
  uint64 uptime_us    = 3;
  bool   camera_ok    = 4;  // camera detected at boot
  bool   tof_a_ok     = 5;  // ToF sensor A detected at boot
  bool   tof_b_ok     = 6;  // ToF sensor B detected at boot
  bool   imu_ok       = 7;  // ICM20948 responding (live, self-heal aware)
  bool   mag_ok       = 8;  // QMC5883L responding (live, self-heal aware)
  bool   gps_ok       = 9;  // GPS module responding to UART (live, freshness-based;
                             // independent of having a satellite fix)
  uint32 gps_detected_baud = 16;  // boot-time auto-scan hit, or fallback if no hit
  bool   gps_baud_confirmed = 17;  // true = actual scan hit, false = unverified fallback
  // Fields 10-15,18 (config-ack/raw-byte-preview debug telemetry) retired
  // 2026-08-05 once GPS was confirmed working — that debugging apparatus
  // did its job; see the serial log (gps_driver.c ESP_LOGI calls, unchanged)
  // for the same info if this ever needs re-diagnosing.
}

// Envelope — every message on the wire is a BoatMessage
message BoatMessage {
  oneof payload {
    SensorSnapshot sensors      = 1;
    MotorCommand   motor        = 2;
    SystemStatus   status       = 3;
    DetectCommand  detect       = 4;
    GpsCoordinate  coord        = 5;
    MotorStatus    motor_status = 6;
    ArmCommand     arm_cmd      = 7;
    WinchCommand   winch        = 8;
    SteerCommand   steer        = 9;
    ServoPowerCommand servo_power = 10;
    SteerRawCommand steer_raw   = 11;
  }
}
