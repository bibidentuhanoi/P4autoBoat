syntax = "proto3";
package boat;

message IMUData {
  float pitch   = 1;
  float roll    = 2;
  float heading = 3;
  // Gyro-Z turn rate, deg/s, SIGNED and raw -- the same FusionResult.yaw_rate
  // the trim learner and SAS run on, not a separate copy. Mag-independent, so
  // it stays meaningful when the heading does not.
  //
  // Which sign means which way round the boat turns is NOT yet established:
  // it depends on how the IMU is physically mounted, and that has not been
  // measured. Display it signed and unlabelled until it has been. Do not
  // negate it, take its magnitude, or "fix" it to match an expectation.
  float yaw_rate = 4;
}

message ToFGrid {
  bool            valid         = 1;
  repeated int32  distances     = 2;  // 64*NB_TARGET values: zone*ntpp+target, row-major 8x8
  repeated uint32 sigma         = 3;  // range_sigma_mm per target (low=clean, high=edge)
  repeated uint32 target_status = 4;  // per-target validity code (5=valid, 9=valid+noisy)
  repeated uint32 nb_target_detected = 5;  // surfaces detected per zone, always 64 values
}

message Detection {
  int32 category = 1;
  float score    = 2;
  int32 x1       = 3;
  int32 y1       = 4;
  int32 x2       = 5;
  int32 y2       = 6;
}

message DetectCommand {
}

// Trigger one dataset capture: a full-quality JPEG + a time-synced sensor
// sidecar written to SD. Empty payload -- the trigger itself carries no
// parameters, matching DetectCommand.
message TrainingLogCommand {
}

message GpsFix {
  bool   valid       = 1;
  double latitude    = 2;
  double longitude   = 3;
  float  altitude_m  = 4;
  float  speed_mps   = 5;
  float  course_deg  = 6;
  uint32 fix_quality = 7;
  uint32 satellites  = 8;
  float  hdop        = 9;
  uint64 utc_ms      = 10;
}

message GpsCoordinate {
  double latitude  = 1;
  double longitude = 2;
}

message SensorSnapshot {
  uint64  timestamp_us        = 1;
  IMUData imu                 = 2;
  ToFGrid tof_a               = 3;
  ToFGrid tof_b               = 4;
  repeated Detection detections = 5;
  GpsFix  gps                 = 6;
}

message MotorCommand {
  float throttle = 1;  // -1.0 to 1.0
  float rudder   = 2;  // -1.0 to 1.0
  float left     = 3;  // left motor -1.0 to 1.0
  float right    = 4;  // right motor -1.0 to 1.0
}

message WinchCommand {
  float speed = 1;  // -1..1 : + = CW/down (pay out), - = CCW/up (reel in), 0 = stop
}

message SteerCommand {
  float left  = 1;  // left rudder  : -1 = full left, +1 = full right, 0 = center
  float right = 2;  // right rudder : -1 = full left, +1 = full right, 0 = center
}

// Calibration-only: bypasses STEER_PULSE_MIN/NEUTRAL/MAX entirely, writes the
// MCPWM compare value directly so the operator can probe past the currently
// configured range to find a servo's true mechanical stop.
message SteerRawCommand {
  uint32 pulse_us = 1;
}

// Yaw-RATE demand for Assisted Steering, in deg/s.
//
// A SEPARATE message from SteerCommand, deliberately. Those two carry
// different physical quantities -- a rate in deg/s and a rudder angle -- and
// overloading one field for both meant the same -1.0 was "+2 deg/s" with the
// loop on and "FULL LEFT RUDDER" with it off. Any confusion about the mode
// therefore threw the rudder to its stop.
//
// With a message of its own there is no value that can be reinterpreted: the
// firmware routes this to the yaw-rate loop and NOWHERE else, and ignores it
// outright when Assisted Steering is off. An automated assisted run can then
// hold SteerCommand at zero the whole time, so even losing the mode mid-run
// leaves the rudder centred rather than hard over.
message SteerRateCommand {
  float target_dps = 1;
}

message MotorStatus {
  uint32 state          = 1;  // motor state enum
  float  left_throttle  = 2;  // current left throttle
  float  right_throttle = 3;  // current right throttle
  float  winch_speed    = 4;  // current winch speed (-1..1)
  bool   servo_power    = 5;  // servo rail (winch + rudders) actually powered
  // --- rudder, as COMMANDED by the firmware ---------------------------------
  // There is no position feedback on this servo. Every field below is what the
  // boat ASKED the rudder to do, never where the rudder actually is. Anything
  // displaying or recording them must say so.
  float  rudder_cmd       = 6;   // normalized, canonical (-1 left .. +1 right)
  uint32 rudder_pulse_us  = 7;   // the pulse that command maps to
  bool   rudder_saturated = 8;   // the assisted loop's output cap bound it
  // --- assisted steering, as the BOAT reports it ----------------------------
  bool   assist_rudder    = 9;   // the rudder loop is actually running
  bool   assist_motor_p   = 10;  // the motor P assist is actually running
  float  yaw_target_dps   = 11;  // physical yaw-rate target the loop is holding
  float  yaw_filt_dps     = 12;  // the loop's own filtered yaw
  // The AssistCommand.request_id the control task has APPLIED. Not the one it
  // has merely received: the RX task only queues a request, and echoing at
  // receipt would acknowledge a mode the boat is not yet in.
  uint32 assist_request_id = 13;
}

message ArmCommand {
  bool arm   = 1;  // true = arm, false = disarm
  bool force = 2;  // arm despite no GPS lock (manual bench/indoor override)
}

// Servo rail (pin 36) switch — independent of ESC arming so winch/rudders can
// be bench-tested without spinning up the thrusters. Arming still forces the
// rail on; disarming cuts it.
message ServoPowerCommand {
  bool on = 1;
}

message SystemStatus {
  uint32 heap_free    = 1;
  int32  wifi_rssi    = 2;
  uint64 uptime_us    = 3;
  bool   camera_ok    = 4;  // camera detected at boot
  bool   tof_a_ok     = 5;  // ToF sensor A detected at boot
  bool   tof_b_ok     = 6;  // ToF sensor B detected at boot
  bool   imu_ok       = 7;  // ICM20948 responding (live, self-heal aware)
  bool   mag_ok       = 8;  // QMC5883L responding (live, self-heal aware)
  bool   gps_ok       = 9;  // GPS module responding to UART (live, freshness-based;
                             // independent of having a satellite fix)
  uint32 gps_detected_baud = 16;  // boot-time auto-scan hit, or fallback if no hit
  bool   gps_baud_confirmed = 17;  // true = actual scan hit, false = unverified fallback
  // Fields 10-15,18 (config-ack/raw-byte-preview debug telemetry) retired
  // 2026-08-05 once GPS was confirmed working — that debugging apparatus
  // did its job; see the serial log (gps_driver.c ESP_LOGI calls, unchanged)
  // for the same info if this ever needs re-diagnosing.
}

// Trigger / stop ESC differential-trim auto-calibration. Shaped like ArmCommand
// (transport-agnostic). start=false is an explicit stop/abort (reused by each
// dashboard's E-stop). average_into_existing picks FRESH overwrite (false) vs
// the both-heading AVERAGE mode (true).
message CalibrateCommand {
  bool start                 = 1;
  bool average_into_existing = 2;
}

// Live calibration progress, published while a sweep runs so either dashboard
// can show it. state mirrors etc_state_t.
message CalibrateStatus {
  uint32 state          = 1;
  uint32 level_index    = 2;
  float  level_throttle = 3;
  float  trim_diff      = 4;  // live differential being learned
  float  yaw_avg_dps    = 5;  // windowed mean of (yaw - b0)
  bool   making_way     = 6;  // GPS says the boat is moving (making-way gate)
  uint32 points_done    = 7;
}

// Runtime switch for the temporary proportional yaw assist. Runtime, not
// compile-time, so the A and B arms of an experiment run the SAME firmware --
// a rebuild between arms would let a build difference look like a result.
message AssistCommand {
  bool p_on = 1;
  // Correlates the acknowledgement with THIS request. Wall-clock arrival time
  // cannot do that job: last-received timestamps record when the GROUND
  // STATION processed a packet, not when the boat sent it, so a stale
  // assist_rudder=true that happens to be processed after a new request
  // satisfies a time-based check and falsely authorises a rate demand.
  // Echoed back in MotorStatus.assist_request_id, and only once the CONTROL
  // TASK has actually applied the change.
  uint32 request_id = 3;
  // Runtime Assisted Steering (rudder yaw-rate loop). DELIBERATELY a separate
  // field from p_on: that one is the MOTOR differential-thrust assist, this is
  // the RUDDER loop, and folding them into one flag would make an experiment
  // that isolates either of them impossible. The firmware refuses to have both
  // on at once, but they are still two switches.
  bool rudder_assist = 2;
}

// Bench throttle-mismatch test. The BOAT runs the whole profile and records to
// its OWN SD card, so a radio dropout cannot spoil the measurement -- the link
// is only used to press the button. kind: 0 = BASE (both equal, so any turn IS
// the mismatch), 1 = LEFT stronger, 2 = RIGHT stronger.
message BenchCommand {
  uint32 kind  = 1;
  float  base  = 2;  // both motors at this throttle, 0..1
  float  delta = 3;  // split added to one side and taken off the other
  // ONE-SHOT: set the trim learner's c to this before the run, and clear its
  // filter and any latched fault. Applied only if the run is actually
  // accepted. 0 (or absent) leaves the learner exactly as it was, which is
  // what every ordinary BASE run sends -- c must carry over between runs or
  // convergence can never be observed.
  float  reset_c = 4;
}

// No string field on purpose: nanopb strings need a size option, and the file
// name is fully derivable from kind/base/file_index (T<pct>_<K>_<NN>.CSV).
message BenchStatus {
  uint32 state      = 1;  // 0 idle, 1 baseline, 2 run, 3 coast, 4 saved, 5 failed
  uint32 kind       = 2;
  float  base       = 3;
  uint32 samples    = 4;
  uint32 file_index = 5;
  float  elapsed_s  = 6;
  float  learn_c    = 7;  // the trim learner's c right now (0 if compiled out)
  bool   p_on       = 8;  // the BOAT's own P-assist state, not the tool's
}

// Envelope — every message on the wire is a BoatMessage
message BoatMessage {
  oneof payload {
    SensorSnapshot sensors      = 1;
    MotorCommand   motor        = 2;
    SystemStatus   status       = 3;
    DetectCommand  detect       = 4;
    GpsCoordinate  coord        = 5;
    MotorStatus    motor_status = 6;
    ArmCommand     arm_cmd      = 7;
    WinchCommand   winch        = 8;
    SteerCommand   steer        = 9;
    ServoPowerCommand servo_power = 10;
    SteerRawCommand steer_raw   = 11;
    TrainingLogCommand training_log = 12;
    CalibrateCommand calibrate  = 13;
    CalibrateStatus calibrate_status = 14;
    BenchCommand   bench        = 15;
    BenchStatus    bench_status = 16;
    AssistCommand  assist       = 17;
    SteerRateCommand steer_rate = 18;
  }
}
