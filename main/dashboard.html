<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBoat Dashboard v2</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:      #05080F;
    --card:    #0B1525;
    --border:  #1A2A44;
    --accent:  #00BFFF;
    --green:   #00FF99;
    --warn:    #FFB300;
    --danger:  #FF3B3B;
    --text:    #C8D8F0;
    --dim:     #4A6080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; font-size: 13px; min-height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); transition: background 0.3s; }
  #status-dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #status-dot.err { background: var(--danger); }
  #status-label { color: var(--dim); font-size: 11px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 12px; padding: 16px; height: calc(100vh - 52px);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  }
  .card-title {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }

  /* Camera card spans left 2 columns, both rows */
  #camera-card { grid-column: 1 / 3; grid-row: 1 / 3; }
  #cam-container { position: relative; width: 100%; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  #cam-img { position: absolute; border-radius: 2px; background: #000; }
  #tof-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }

  /* IMU card */
  #imu-card { grid-column: 3; grid-row: 1; }
  .imu-vals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 1; }
  .imu-val { background: var(--bg); border-radius: 6px; padding: 10px 6px; text-align: center; }
  .imu-label { font-size: 9px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .imu-num { font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 4px; }
  .imu-unit { font-size: 9px; color: var(--dim); }
  #horizon-wrap { display: flex; justify-content: center; }
  canvas.horizon { border-radius: 50%; border: 2px solid var(--border); }

  /* ToF grids card */
  #tof-card { grid-column: 3; grid-row: 2; }
  .tof-grids { display: flex; gap: 12px; flex: 1; align-items: center; justify-content: center; }
  .tof-grid-wrap { text-align: center; }
  .tof-label { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }
  canvas.tof { border-radius: 4px; image-rendering: pixelated; }
</style>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7/dist/protobuf.min.js"></script>
</head>
<body>

<header>
  <h1>AutoBoat v2</h1>
  <div id="status-dot"></div>
  <span id="status-label">disconnected</span>
  <span id="sys-heap" style="margin-left:auto; color:var(--dim); font-size:11px;"></span>
  <span id="sys-rssi" style="color:var(--dim); font-size:11px;"></span>
  <span id="sys-uptime" style="color:var(--dim); font-size:11px;"></span>
  <span id="msg-rate" style="color:var(--dim); font-size:11px;"></span>

  <span style="color:var(--dim); font-size:11px;">Overlay:</span>
  <select id="overlay-mode" style="background:var(--card);color:var(--text);border:1px solid var(--border);font-size:11px;padding:2px 4px;border-radius:4px;">
    <option value="off">Off</option>
    <option value="threshold">Threshold</option>
    <option value="heatmap">Heatmap</option>
    <option value="raw" selected>Raw grid</option>
  </select>
  <label style="color:var(--dim); font-size:11px; cursor:pointer;">
    <input type="range" id="thresh-range" min="500" max="4000" value="2000" step="100" style="width:60px;vertical-align:middle;" />
    <span id="thresh-label">2.0m</span>
  </label>

  <span style="color:var(--dim); font-size:11px; margin-left:8px;">Flip A:</span>
  <label style="color:var(--text); font-size:11px;"><input type="checkbox" id="flipHA" /> H</label>
  <label style="color:var(--text); font-size:11px;"><input type="checkbox" id="flipVA" /> V</label>
  <label style="color:var(--warn); font-size:11px;" title="Transpose"><input type="checkbox" id="transA" /> T</label>
  <span style="color:var(--dim); font-size:11px; margin-left:8px;">Flip B:</span>
  <label style="color:var(--text); font-size:11px;"><input type="checkbox" id="flipHB" checked /> H</label>
  <label style="color:var(--text); font-size:11px;"><input type="checkbox" id="flipVB" checked /> V</label>
  <label style="color:var(--warn); font-size:11px;" title="Transpose"><input type="checkbox" id="transB" /> T</label>
  <span style="color:var(--dim); font-size:11px; margin-left:8px;">Az:</span>
  <input type="range" id="az-slider" min="-40" max="10" value="-16.7" step="0.1" style="width:50px;vertical-align:middle;" />
  <span id="az-label" style="color:var(--text); font-size:11px;">-16.7°</span>
  <span style="color:var(--dim); font-size:11px; margin-left:4px;">El:</span>
  <input type="range" id="el-slider" min="-10" max="40" value="19.4" step="0.1" style="width:50px;vertical-align:middle;" />
  <span id="el-label" style="color:var(--text); font-size:11px;">19.4°</span>
  <span style="color:var(--dim); font-size:11px; margin-left:4px;">Sz:</span>
  <input type="range" id="sz-slider" min="0.5" max="4" value="1.7" step="0.1" style="width:50px;vertical-align:middle;" />
  <span id="sz-label" style="color:var(--text); font-size:11px;">1.7×</span>
</header>

<div class="grid">
  <div class="card" id="camera-card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">Camera + ToF overlay<button id="snap-btn" style="background:var(--border);color:var(--text);border:none;border-radius:3px;padding:2px 8px;font-size:10px;cursor:pointer;">Snap</button></div>
    <div id="cam-container">
      <img id="cam-img" src="" alt="No stream" />
      <canvas id="tof-overlay"></canvas>
    </div>
  </div>

  <div class="card" id="imu-card">
    <div class="card-title">IMU — ICM20948</div>
    <div id="horizon-wrap">
      <canvas class="horizon" id="horizon" width="120" height="120"></canvas>
    </div>
    <div class="imu-vals">
      <div class="imu-val"><div class="imu-label">Pitch</div><div class="imu-num" id="imu-pitch">—</div><div class="imu-unit">deg</div></div>
      <div class="imu-val"><div class="imu-label">Roll</div><div class="imu-num" id="imu-roll">—</div><div class="imu-unit">deg</div></div>
      <div class="imu-val"><div class="imu-label">Heading</div><div class="imu-num" id="imu-hdg">—</div><div class="imu-unit">deg</div></div>
    </div>
  </div>

  <div class="card" id="tof-card">
    <div class="card-title">ToF — VL53L5CX 8×8</div>
    <div class="tof-grids">
      <div class="tof-grid-wrap"><div class="tof-label">Sensor A</div><canvas class="tof" id="tof-a" width="8" height="8" style="width:120px;height:120px;"></canvas></div>
      <div class="tof-grid-wrap"><div class="tof-label">Sensor B</div><canvas class="tof" id="tof-b" width="8" height="8" style="width:120px;height:120px;"></canvas></div>
    </div>
    <div id="tof-range-label" style="text-align:center;font-size:10px;color:var(--dim);">0–2000 mm</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEG2RAD = Math.PI / 180;

// ═══════════════════════════════════════════════════════════════
// Proto schema (matches boat.proto)
// ═══════════════════════════════════════════════════════════════
const protoSchema = `
syntax = "proto3";
package boat;
message IMUData { float pitch = 1; float roll = 2; float heading = 3; }
message ToFGrid { bool valid = 1; repeated int32 distances = 2; }
message SensorSnapshot { uint64 timestamp_us = 1; IMUData imu = 2; ToFGrid tof_a = 3; ToFGrid tof_b = 4; }
message MotorCommand { float throttle = 1; float rudder = 2; }
message SystemStatus { uint32 heap_free = 1; int32 wifi_rssi = 2; uint64 uptime_us = 3; }
message BoatMessage { oneof payload { SensorSnapshot sensors = 1; MotorCommand motor = 2; SystemStatus status = 3; } }
`;
const root = protobuf.parse(protoSchema).root;
const BoatMessage = root.lookupType('boat.BoatMessage');

// ═══════════════════════════════════════════════════════════════
// Projection — direct geometric model (measured from PCB + optics)
// ═══════════════════════════════════════════════════════════════
const CAM = { w: 800, h: 640 };
const FX = 616;                    // camera focal length (pixels)
const ZONE_STEP = 7.875;           // degrees per zone (63° / 8)
let AZ_OFFSET = -16.7;             // horizontal axis alignment (deg)
let EL_OFFSET = 19.4;              // vertical axis alignment (deg)
let GRID_SCALE = 1.7;              // overlay size multiplier
const SENSOR_TZ = 6.78;            // sensor Z offset behind camera (mm)
const SENSOR_A = { x: -22.8, tilt: -5 };  // left, tilted outward
const SENSOR_B = { x:  22.8, tilt:  5 };  // right, tilted outward

const FLIP = {
  flipHA: false, flipVA: false, transA: false,
  flipHB: true,  flipVB: true,  transB: false,
};

let overlayMode = 'raw';
let thresholdMM = 2000;
let imuPitch = 0, imuRoll = 0;
let lastTofA = null, lastTofB = null;

// ═══════════════════════════════════════════════════════════════
// Depth reading with flip/transpose
// ═══════════════════════════════════════════════════════════════
function readDepth(arr, row, col, flipH, flipV, trans) {
  if (!arr || arr.length < 64) return 0;
  let r = flipV ? (7 - row) : row;
  let c = flipH ? (7 - col) : col;
  return arr[trans ? (c * 8 + r) : (r * 8 + c)] || 0;
}

// Project a zone to camera pixel using direct geometric model
// sensor: SENSOR_A or SENSOR_B, row/col: zone indices, depth: mm
function zoneToPixel(sensor, row, col, depth) {
  const az = (col - 3.5) * ZONE_STEP + sensor.tilt + AZ_OFFSET;
  const el = (3.5 - row) * ZONE_STEP + EL_OFFSET;
  const px = sensor.x + depth * Math.tan(az * DEG2RAD);
  const py = depth * Math.tan(el * DEG2RAD);
  const pz = depth + SENSOR_TZ;
  if (pz <= 1) return null;
  const u = FX * (px / pz) + 400;
  const v = -FX * (py / pz) + 320;
  // Scale around image center
  return [400 + (u - 400) * GRID_SCALE, 320 + (v - 320) * GRID_SCALE];
}

// Get zone center pixel + visibility flag
function getZoneCenter(sensor, row, col, mm) {
  const p = zoneToPixel(sensor, row, col, mm);
  if (!p) return null;
  p.inFrame = (p[0] >= 0 && p[0] <= CAM.w && p[1] >= 0 && p[1] <= CAM.h);
  return p;
}

// Get zone quad (4 corners at half-zone offsets)
function getZoneQuad(sensor, row, col, mm) {
  const offsets = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]];
  const pts = offsets.map(([dr, dc]) => {
    const az = (col + dc - 3.5) * ZONE_STEP + sensor.tilt + AZ_OFFSET;
    const el = (3.5 - row - dr) * ZONE_STEP + EL_OFFSET;
    const px = sensor.x + mm * Math.tan(az * DEG2RAD);
    const py = mm * Math.tan(el * DEG2RAD);
    const pz = mm + SENSOR_TZ;
    if (pz <= 1) return null;
    const u = FX * (px / pz) + 400;
    const v = -FX * (py / pz) + 320;
    return [400 + (u - 400) * GRID_SCALE, 320 + (v - 320) * GRID_SCALE];
  });

  const valid = pts.filter(p => p !== null);
  if (valid.length < 3) return null;
  const filled = pts.map(p => p || valid[0]);

  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
  for (const p of filled) {
    minU = Math.min(minU, p[0]); maxU = Math.max(maxU, p[0]);
    minV = Math.min(minV, p[1]); maxV = Math.max(maxV, p[1]);
  }
  return { pts: filled, inFrame: maxU >= 0 && minU <= CAM.w && maxV >= 0 && minV <= CAM.h };
}

// ═══════════════════════════════════════════════════════════════
// Overlay rendering
// ═══════════════════════════════════════════════════════════════
let overlayCtx = null, overlayScale = 1, overlayOffX = 0, overlayOffY = 0;

function updateOverlaySize() {
  const canvas = $('tof-overlay');
  const container = $('cam-container');
  const img = $('cam-img');
  const cw = container.clientWidth, ch = container.clientHeight;
  canvas.width = cw; canvas.height = ch;

  const aspect = CAM.w / CAM.h;
  const containerAspect = cw / ch;
  let drawW, drawH;
  if (containerAspect > aspect) { drawH = ch; drawW = ch * aspect; }
  else { drawW = cw; drawH = cw / aspect; }

  overlayScale = drawW / CAM.w;
  overlayOffX = (cw - drawW) / 2;
  overlayOffY = (ch - drawH) / 2;

  overlayCtx = canvas.getContext('2d');

  // Position camera image to match overlay coordinate space
  img.style.objectFit = 'fill';
  img.style.position = 'absolute';
  img.style.left   = overlayOffX + 'px';
  img.style.top    = overlayOffY + 'px';
  img.style.width  = drawW + 'px';
  img.style.height = drawH + 'px';
  img.style.borderRadius = '2px';
}

let dragOffX = 27, dragOffY = 48;

function camToDisplay(px, py) {
  return [px * overlayScale + overlayOffX + dragOffX, py * overlayScale + overlayOffY + dragOffY];
}

function dangerColor(mm, thresh) {
  const t = Math.min(mm / thresh, 1);
  let r, g, b, alpha;
  if (t < 0.5) {
    const u = t / 0.5;
    r = 255; g = Math.round(50 + u * 160); b = Math.round(50 * (1 - u));
    alpha = 0.45 - u * 0.10;
  } else {
    const u = (t - 0.5) / 0.5;
    r = Math.round(255 * (1 - u)); g = Math.round(210 - u * 10); b = Math.round(u * 255);
    alpha = 0.35 - u * 0.15;
  }
  return {
    fill: `rgba(${r},${g},${b},${alpha})`,
    stroke: `rgb(${r},${g},${b})`,
  };
}

function renderOverlay(tofA, tofB) {
  lastTofA = tofA || lastTofA;
  lastTofB = tofB || lastTofB;
  if (!overlayCtx) return;

  const canvas = $('tof-overlay');
  const ctx = overlayCtx;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (overlayMode === 'off') return;

  if (overlayMode === 'threshold') drawThreshold(ctx, lastTofA, lastTofB);
  else if (overlayMode === 'heatmap') drawHeatmap(ctx, lastTofA, lastTofB);
  else if (overlayMode === 'raw') drawRawGrid(ctx, lastTofA, lastTofB);
}

function drawThreshold(ctx, tofA, tofB) {
  const canvas = $('tof-overlay');
  const cw = canvas.width, ch = canvas.height;
  let closest = { mm: Infinity, x: 0, y: 0 };
  // Edge warnings: track closest depth per edge for out-of-frame zones
  const edges = { left: [], right: [], top: [], bottom: [] };

  function drawSensor(grid, sensor, flipH, flipV, trans) {
    if (!grid || !grid.valid || !grid.distances || grid.distances.length < 64) return;

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const mm = readDepth(grid.distances, row, col, flipH, flipV, trans);
        if (!mm || mm <= 0) continue;

        const center = getZoneCenter(sensor, row, col, mm);
        if (!center) continue;
        const dp = camToDisplay(center[0], center[1]);

        if (center.inFrame && mm <= thresholdMM) {
          // ── In-frame: colored quad + crosshair ──
          const quad = getZoneQuad(sensor, row, col, mm);
          if (quad && quad.inFrame) {
            const colors = dangerColor(mm, thresholdMM);
            const pts = quad.pts.map(p => camToDisplay(p[0], p[1]));
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = colors.fill;
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = colors.stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // Crosshair marker
          const sz = 5;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(dp[0] - sz, dp[1]); ctx.lineTo(dp[0] + sz, dp[1]);
          ctx.moveTo(dp[0], dp[1] - sz); ctx.lineTo(dp[0], dp[1] + sz);
          ctx.stroke();

          // Distance label
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText((mm / 1000).toFixed(1), dp[0], dp[1] - 6);

          if (mm < closest.mm) closest = { mm, x: dp[0], y: dp[1] };
        } else {
          // ── Out-of-frame: collect for edge bars ──
          if (dp[0] < 0) edges.left.push({ mm, pos: dp[1] });
          else if (dp[0] > cw) edges.right.push({ mm, pos: dp[1] });
          if (dp[1] < 0) edges.top.push({ mm, pos: dp[0] });
          else if (dp[1] > ch) edges.bottom.push({ mm, pos: dp[0] });
        }
      }
    }
  }

  drawSensor(tofA, SENSOR_A, FLIP.flipHA, FLIP.flipVA, FLIP.transA);
  drawSensor(tofB, SENSOR_B, FLIP.flipHB, FLIP.flipVB, FLIP.transB);

  // ── Edge warning bars ──
  const BAR = 12;
  function drawEdge(zones, x, y, w, h, vertical) {
    if (zones.length === 0) return;
    const min = Math.min(...zones.map(z => z.mm));
    const intensity = Math.max(0.15, 1 - min / thresholdMM);
    const [r, g, b] = distToColor(min);
    // Glow bar
    const grad = vertical
      ? ctx.createLinearGradient(x, y, x + w, y)
      : ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, `rgba(${r},${g},${b},${(intensity * 0.7).toFixed(2)})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    // Tick marks for individual zones
    ctx.fillStyle = `rgba(255,255,255,${intensity.toFixed(2)})`;
    for (const z of zones) {
      const t = Math.max(0.2, 1 - z.mm / thresholdMM);
      ctx.globalAlpha = t;
      if (vertical) {
        const py = Math.max(0, Math.min(ch - 3, z.pos));
        ctx.fillRect(x, py, w, 2);
      } else {
        const px = Math.max(0, Math.min(cw - 3, z.pos));
        ctx.fillRect(px, y, 2, h);
      }
    }
    ctx.globalAlpha = 1;
    // Depth label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = (min / 1000).toFixed(1) + 'm';
    if (vertical) ctx.fillText(label, x + w / 2, Math.min(ch - 10, Math.max(10, zones[0].pos)));
    else ctx.fillText(label, Math.min(cw - 20, Math.max(20, zones[0].pos)), y + h / 2);
  }

  drawEdge(edges.left,   0,        0,  BAR, ch,  true);
  drawEdge(edges.right,  cw - BAR, 0,  BAR, ch,  true);
  drawEdge(edges.top,    0,        0,  cw,  BAR, false);
  drawEdge(edges.bottom, 0,  ch - BAR, cw,  BAR, false);

  // ── Closest target indicator ──
  if (closest.mm < Infinity) {
    ctx.globalAlpha = 1.0;
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(closest.x - 28, closest.y - 14, 56, 28);
    ctx.setLineDash([]);
    const tag = `CLOSEST ${(closest.mm / 1000).toFixed(1)}m`;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    const tw = ctx.measureText(tag).width + 12;
    ctx.fillRect(closest.x - tw / 2, closest.y - 32, tw, 18);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tag, closest.x, closest.y - 23);
  }
}

function drawHeatmap(ctx, tofA, tofB) {
  function drawSensor(grid, sensor, flipH, flipV, trans) {
    if (!grid || !grid.valid || !grid.distances || grid.distances.length < 64) return;

    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const mm = readDepth(grid.distances, row, col, flipH, flipV, trans);
        if (!mm || mm <= 0) continue;

        const center = getZoneCenter(sensor, row, col, mm);
        if (!center || !center.inFrame) continue;

        const dp = camToDisplay(center[0], center[1]);
        const t = Math.min(mm, 4000) / 4000;
        let r, g, b;
        if (t < 0.25) { r = 255; g = Math.round(t * 4 * 200); b = 0; }
        else if (t < 0.5) { r = Math.round(255 - (t - 0.25) * 4 * 255); g = 220; b = 0; }
        else if (t < 0.75) { r = 0; g = Math.round(220 - (t - 0.5) * 4 * 120); b = Math.round((t - 0.5) * 4 * 255); }
        else { r = 0; g = Math.round(100 - (t - 0.75) * 4 * 60); b = Math.round(255 - (t - 0.75) * 4 * 55); }

        // Draw as a soft circle instead of a hard quad
        const radius = Math.max(8, 30 * overlayScale * (1000 / Math.max(mm, 200)));
        const grad = ctx.createRadialGradient(dp[0], dp[1], 0, dp[0], dp[1], radius);
        grad.addColorStop(0, `rgba(${r},${g},${b},0.6)`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(dp[0], dp[1], radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  drawSensor(tofA, SENSOR_A, FLIP.flipHA, FLIP.flipVA, FLIP.transA);
  drawSensor(tofB, SENSOR_B, FLIP.flipHB, FLIP.flipVB, FLIP.transB);
}

function drawRawGrid(ctx, tofA, tofB) {
  function drawSensor(grid, sensor, flipH, flipV, trans, label) {
    if (!grid || !grid.valid || !grid.distances || grid.distances.length < 64) return;
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const mm = readDepth(grid.distances, row, col, flipH, flipV, trans);
        // Use the same projection as all other modes
        const center = getZoneCenter(sensor, row, col, mm || 1000);
        if (!center) continue;
        const dp = camToDisplay(center[0], center[1]);
        // Get cell size from adjacent zone
        const next = getZoneCenter(sensor, row, Math.min(7, col + 1), mm || 1000);
        const below = getZoneCenter(sensor, Math.min(7, row + 1), col, mm || 1000);
        const cw = next ? Math.abs(camToDisplay(next[0], next[1])[0] - dp[0]) : 30;
        const ch = below ? Math.abs(camToDisplay(below[0], below[1])[1] - dp[1]) : 30;
        const x = dp[0] - cw / 2, y = dp[1] - ch / 2;
        if (mm > 0) {
          const [r, g, b] = distToColor(mm);
          ctx.fillStyle = `rgba(${r},${g},${b},0.55)`;
          ctx.fillRect(x, y, cw - 1, ch - 1);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(Math.round(mm / 10) + '', dp[0], dp[1]);
        } else {
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(x, y, cw - 1, ch - 1);
        }
      }
    }
    // Label
    const lp = getZoneCenter(sensor, 0, 0, 1000);
    if (lp) {
      const ldp = camToDisplay(lp[0], lp[1]);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(ldp[0] - 5, ldp[1] - 26, 30, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(label, ldp[0], ldp[1] - 20);
    }
  }

  drawSensor(tofA, SENSOR_A, FLIP.flipHA, FLIP.flipVA, FLIP.transA, 'A');
  drawSensor(tofB, SENSOR_B, FLIP.flipHB, FLIP.flipVB, FLIP.transB, 'B');
}

// ═══════════════════════════════════════════════════════════════
// IMU Horizon
// ═══════════════════════════════════════════════════════════════
function drawHorizon(pitch, roll) {
  const c = $('horizon');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height, cx = w / 2, cy = h / 2, r = w / 2 - 2;
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  ctx.translate(cx, cy);
  ctx.rotate(roll * DEG2RAD);
  const offset = Math.max(-r, Math.min(r, pitch * 2));
  ctx.fillStyle = '#001A33'; ctx.fillRect(-r, -r, r * 2, r + offset);
  ctx.fillStyle = '#2D1A00'; ctx.fillRect(-r, offset, r * 2, r * 2);
  ctx.strokeStyle = '#FFB300'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-r, offset); ctx.lineTo(r, offset); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#00BFFF'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 12, cy); ctx.lineTo(cx + 12, cy);
  ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 12);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#1A2A44'; ctx.lineWidth = 2; ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════
// ToF 8×8 grid display (small debug canvases)
// ═══════════════════════════════════════════════════════════════
const MAX_MM = 2000;
function distToColor(mm) {
  if (!mm || mm <= 0) return [20, 20, 20];
  const t = Math.min(mm, MAX_MM) / MAX_MM;
  const stops = [[255,0,0],[255,180,0],[0,255,80],[0,200,255],[0,60,200]];
  const scaled = t * (stops.length - 1);
  const i = Math.floor(scaled), f = scaled - i;
  const a = stops[Math.min(i, stops.length - 1)];
  const b = stops[Math.min(i + 1, stops.length - 1)];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}

function drawTof(canvasId, tofGrid, flipH, flipV, trans) {
  const c = $(canvasId);
  const ctx = c.getContext('2d');
  if (!tofGrid || !tofGrid.valid || !tofGrid.distances || tofGrid.distances.length < 64) {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, 8, 8); return;
  }
  const img = ctx.createImageData(8, 8);
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const mm = readDepth(tofGrid.distances, row, col, flipH, flipV, trans);
      const [r, g, b] = distToColor(mm);
      const idx = (row * 8 + col) * 4;
      img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ═══════════════════════════════════════════════════════════════
// Network — host resolution, MJPEG stream, WebSocket
// ═══════════════════════════════════════════════════════════════
const _params = new URLSearchParams(window.location.search);
const _isLocal = ['localhost','127.0.0.1',''].includes(window.location.hostname);
const ESP_FALLBACK = '192.168.1.201';
const ESP_HOST = _params.get('host') || (_isLocal ? ESP_FALLBACK : window.location.hostname);
let _wsFallback = false;

function startStream() {
  const img = $('cam-img');
  const host = _wsFallback ? ESP_FALLBACK : ESP_HOST;
  const url = `http://${host}:81/stream`;
  if (img.src === url) return;  // don't restart a working stream
  console.log('[Stream]', `connecting to ${url}`);
  img.src = url;
  img.onload = () => console.log('[Stream]', 'first frame received');
  img.onerror = () => {
    console.log('[Stream]', `error loading from ${host}:81`);
    if (!_wsFallback && ESP_HOST !== ESP_FALLBACK) {
      _wsFallback = true;
      console.log('[Stream]', `falling back to ${ESP_FALLBACK}:81`);
      img.src = `http://${ESP_FALLBACK}:81/stream`;
    }
  };
}

let ws = null, msgCount = 0, lastRateTime = Date.now(), reconnectTimer = null;
let _lastMsgAt = Date.now(), _streamAlive = Date.now();
let _reconnectDelay = 1000;  // exponential backoff: 1s → 2s → 4s → 8s max

function connectWS() {
  // Guard: don't open a new socket if one is already connecting or open
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

  // Clean up any lingering socket
  if (ws) {
    try { ws.close(); } catch(e) {}
    ws = null;
  }

  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

  const host = _wsFallback ? ESP_FALLBACK : ESP_HOST;
  ws = new WebSocket(`ws://${host}:80/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    _lastMsgAt = Date.now();
    _reconnectDelay = 1000;  // reset backoff on successful connect
    $('status-dot').className = 'ok';
    $('status-label').textContent = 'connected';
    console.log('[WS]', `connected to ${host}:80/ws`);
  };

  ws.onmessage = (evt) => {
    msgCount++;
    _lastMsgAt = Date.now();
    try {
      const msg = BoatMessage.decode(new Uint8Array(evt.data));
      if (msg.sensors) {
        const s = msg.sensors;
        if (s.imu) {
          imuPitch = s.imu.pitch;
          imuRoll  = s.imu.roll;
          $('imu-pitch').textContent = s.imu.pitch.toFixed(1);
          $('imu-roll').textContent  = s.imu.roll.toFixed(1);
          $('imu-hdg').textContent   = s.imu.heading.toFixed(1);
          drawHorizon(s.imu.pitch, s.imu.roll);
        }
        if (s.tofA) drawTof('tof-a', s.tofA, FLIP.flipHA, FLIP.flipVA, FLIP.transA);
        if (s.tofB) drawTof('tof-b', s.tofB, FLIP.flipHB, FLIP.flipVB, FLIP.transB);
        if (s.tofA || s.tofB) renderOverlay(s.tofA, s.tofB);
      }
      if (msg.status) {
        const st = msg.status;
        $('sys-heap').textContent = `Heap: ${(st.heapFree / 1024).toFixed(0)} KB`;
        $('sys-rssi').textContent = st.wifiRssi ? `RSSI: ${st.wifiRssi} dBm` : '';
        const secs = Number(st.uptimeUs) / 1e6;
        $('sys-uptime').textContent = `Up: ${Math.floor(secs/60)}m${Math.floor(secs%60)}s`;
      }
    } catch (e) { console.error('[Proto]', `decode error: ${e.message}`); }
  };

  ws.onerror = (ev) => {
    console.log('[WS]', `error — will fallback: ${!_wsFallback && ESP_HOST !== ESP_FALLBACK}`);
    if (!_wsFallback && ESP_HOST !== ESP_FALLBACK) {
      _wsFallback = true;
      startStream();
    }
  };

  ws.onclose = (ev) => {
    const reason = ev.code === 1000 ? 'clean' : ev.code === 1006 ? 'abnormal (no close frame)' : `code ${ev.code}`;
    console.log('[WS]', `closed — ${reason}, reason: "${ev.reason || 'none'}", retry in ${_reconnectDelay}ms`);
    ws = null;
    $('status-dot').className = 'err';
    $('status-label').textContent = 'disconnected';
    reconnectTimer = setTimeout(connectWS, _reconnectDelay);
    _reconnectDelay = Math.min(_reconnectDelay * 2, 8000);
  };
}

setInterval(() => {
  const now = Date.now();
  const rate = msgCount / ((now - lastRateTime) / 1000);
  $('msg-rate').textContent = `${rate.toFixed(1)} msg/s`;
  msgCount = 0; lastRateTime = now;
}, 2000);

// ── Watchdog: detect WS stall only (stream is independent) ───────
setInterval(() => {
  const now = Date.now();
  // WS: if no message for 6s but socket thinks it's open, kill it
  if (ws && ws.readyState === WebSocket.OPEN && now - _lastMsgAt > 6000) {
    const silent = ((now - _lastMsgAt) / 1000).toFixed(1);
    console.warn('[Watch]', `WS silent for ${silent}s, forcing reconnect`);
    ws.close();
  }
}, 5000);

// ═══════════════════════════════════════════════════════════════
// UI event bindings
// ═══════════════════════════════════════════════════════════════
$('snap-btn').addEventListener('click', () => {
  const img = $('cam-img');
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `snap_${Date.now()}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
    console.log('[Snap]', `saved ${c.width}x${c.height}`);
  }, 'image/jpeg', 0.95);
});
$('overlay-mode').addEventListener('change', e => {
  overlayMode = e.target.value;
  renderOverlay(lastTofA, lastTofB);
});
$('thresh-range').addEventListener('input', e => {
  thresholdMM = +e.target.value;
  $('thresh-label').textContent = (thresholdMM / 1000).toFixed(1) + 'm';
  renderOverlay(lastTofA, lastTofB);
});

['flipHA','flipVA','transA','flipHB','flipVB','transB'].forEach(id => {
  const cb = $(id);
  if (cb) {
    cb.checked = FLIP[id];
    cb.addEventListener('change', e => {
      FLIP[id] = e.target.checked;
      renderOverlay(lastTofA, lastTofB);
    });
  }
});

const resizeObs = new ResizeObserver(() => updateOverlaySize());
resizeObs.observe($('cam-container'));

// ── Drag overlay to calibrate ToF-to-camera alignment ──
{
  const oc = $('tof-overlay');
  let dragging = false, startX = 0, startY = 0, baseX = 0, baseY = 0;
  oc.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    baseX = dragOffX; baseY = dragOffY;
    oc.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    dragOffX = baseX + (e.clientX - startX);
    dragOffY = baseY + (e.clientY - startY);
    renderOverlay(lastTofA, lastTofB);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    oc.style.cursor = 'grab';
    // Convert pixel offset back to camera-space for sensor config
    const camDx = dragOffX / overlayScale;
    const camDy = dragOffY / overlayScale;
    console.log('[Drag]', `offset px=(${dragOffX.toFixed(0)}, ${dragOffY.toFixed(0)}) cam=(${camDx.toFixed(1)}, ${camDy.toFixed(1)})`);
  });
}

$('az-slider').addEventListener('input', e => {
  AZ_OFFSET = +e.target.value;
  $('az-label').textContent = AZ_OFFSET.toFixed(1) + '°';
  renderOverlay(lastTofA, lastTofB);
});
$('el-slider').addEventListener('input', e => {
  EL_OFFSET = +e.target.value;
  $('el-label').textContent = EL_OFFSET.toFixed(1) + '°';
  renderOverlay(lastTofA, lastTofB);
});
$('sz-slider').addEventListener('input', e => {
  GRID_SCALE = +e.target.value;
  $('sz-label').textContent = GRID_SCALE.toFixed(1) + '×';
  renderOverlay(lastTofA, lastTofB);
});

// ═══════════════════════════════════════════════════════════════
// Debug helpers (paste in console)
// ═══════════════════════════════════════════════════════════════
window.debug = {
  gridA: () => debug._grid(lastTofA, FLIP.flipHA, FLIP.flipVA, FLIP.transA, 'A'),
  gridB: () => debug._grid(lastTofB, FLIP.flipHB, FLIP.flipVB, FLIP.transB, 'B'),
  _grid: (grid, flipH, flipV, trans, label) => {
    if (!grid || !grid.valid || !grid.distances) return `Sensor ${label}: no data`;
    const rows = []; let valid = 0, zero = 0;
    for (let r = 0; r < 8; r++) {
      const row = [];
      for (let c = 0; c < 8; c++) {
        const mm = readDepth(grid.distances, r, c, flipH, flipV, trans);
        if (mm > 0) { valid++; row.push(mm); } else { zero++; row.push(null); }
      }
      rows.push(row);
    }
    return { label, flipH, flipV, trans, valid, zero, housing: 0, total: 64, rows };
  },
  colsA: () => debug._cols(lastTofA, FLIP.flipHA, FLIP.flipVA, FLIP.transA, 'A'),
  colsB: () => debug._cols(lastTofB, FLIP.flipHB, FLIP.flipVB, FLIP.transB, 'B'),
  _cols: (grid, flipH, flipV, trans, label) => {
    if (!grid || !grid.valid || !grid.distances) return `Sensor ${label}: no data`;
    const avgs = [];
    for (let c = 0; c < 8; c++) {
      let sum = 0, cnt = 0;
      for (let r = 0; r < 8; r++) {
        const v = readDepth(grid.distances, r, c, flipH, flipV, trans);
        if (v > 0) { sum += v; cnt++; }
      }
      avgs.push(cnt > 0 ? Math.round(sum / cnt) : 0);
    }
    const validAvgs = avgs.filter(a => a > 0);
    const gradient = validAvgs.length > 1 ? validAvgs[validAvgs.length - 1] - validAvgs[0] : 0;
    return { label, columns: avgs, gradient: gradient + 'mm', direction: gradient > 0 ? 'increasing L→R' : gradient < 0 ? 'decreasing L→R' : 'flat', validCols: validAvgs.length + '/8' };
  },
  angles: (sensor = 'a') => {
    const s = sensor === 'b' ? SENSOR_B : SENSOR_A;
    const tbl = [];
    for (let r = 0; r < 8; r++) {
      const row = [];
      for (let c = 0; c < 8; c++) {
        const az = (c - 3.5) * ZONE_STEP + s.tilt + AZ_OFFSET;
        const el = (3.5 - r) * ZONE_STEP + EL_OFFSET;
        row.push({ az: +az.toFixed(2), el: +el.toFixed(2) });
      }
      tbl.push(row);
    }
    return tbl;
  },
  rawA: () => debug._raw(lastTofA, FLIP.flipHA, FLIP.flipVA, FLIP.transA, 'A'),
  rawB: () => debug._raw(lastTofB, FLIP.flipHB, FLIP.flipVB, FLIP.transB, 'B'),
  _raw: (grid, flipH, flipV, trans, label) => {
    if (!grid || !grid.valid || !grid.distances) return `Sensor ${label}: no data`;
    const rows = []; let valid = 0, zero = 0;
    for (let r = 0; r < 8; r++) {
      const row = [];
      for (let c = 0; c < 8; c++) {
        const mm = readDepth(grid.distances, r, c, flipH, flipV, trans);
        if (mm > 0) { valid++; row.push(mm); } else { zero++; row.push(null); }
      }
      rows.push(row);
    }
    return { label, flipH, flipV, trans, valid, zero, total: 64, rows };
  },
  imu: () => ({ pitch: imuPitch, roll: imuRoll }),
};

// ═══════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════
drawHorizon(0, 0);
drawTof('tof-a', null, false, false, false);
drawTof('tof-b', null, false, false, false);
updateOverlaySize();
console.log('[Init]', `host=${ESP_HOST} fallback=${ESP_FALLBACK} local=${_isLocal}`);
startStream();
connectWS();
</script>
