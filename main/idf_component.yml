## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.3'
  rjrp44/vl53l5cx:
    version: "^4.0.0"
  ## Camera: video framework + JPEG encoder
  espressif/esp_video:
    version: "2.0.1"
  espressif/esp_new_jpeg:
    version: "1.0.0"
  ## WiFi on ESP32-P4 (via coprocessor, e.g. ESP32-C6)
  espressif/esp_wifi_remote:
    version: "1.4.2"
  # Keep the P4 host transport aligned with the C6 SDIO slave firmware this
  # project flashes (tools/sdio_flasher/README.md).  The resolver otherwise
  # upgrades this private esp_wifi_remote dependency independently.
  espressif/esp_hosted:
    version: "2.12.3"
  ## Protobuf encoding for telemetry pipeline
  livekit/nanopb:
    version: "^0.4.9"
  ## esp-dl cat detection model (pico 224x224)
  espressif/cat_detect:
    version: "*"
