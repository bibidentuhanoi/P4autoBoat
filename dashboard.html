<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBoat Dashboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:      #05080F;
    --card:    #0B1525;
    --border:  #1A2A44;
    --accent:  #00BFFF;
    --green:   #00FF99;
    --warn:    #FFB300;
    --danger:  #FF3B3B;
    --text:    #C8D8F0;
    --dim:     #4A6080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', monospace;
    font-size: 13px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s;
  }
  #status-dot.ok   { background: var(--green); box-shadow: 0 0 8px var(--green); }
  #status-dot.err  { background: var(--danger); }
  #status-label { color: var(--dim); font-size: 11px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 12px;
    padding: 16px;
    height: calc(100vh - 52px);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .card-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  /* Camera */
  #camera-card { grid-column: 1 / 3; grid-row: 1 / 3; }
  #cam-img {
    width: 100%;
    flex: 1;
    object-fit: contain;
    border-radius: 4px;
    background: #000;
    min-height: 0;
  }
  /* IMU */
  #imu-card { grid-column: 3; grid-row: 1; }
  .imu-vals {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    flex: 1;
  }
  .imu-val {
    background: var(--bg);
    border-radius: 6px;
    padding: 10px 6px;
    text-align: center;
  }
  .imu-label { font-size: 9px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
  .imu-num { font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 4px; }
  .imu-unit { font-size: 9px; color: var(--dim); }
  /* Horizon */
  #horizon-wrap { display: flex; justify-content: center; }
  canvas.horizon {
    border-radius: 50%;
    border: 2px solid var(--border);
  }
  /* ToF */
  #tof-card { grid-column: 3; grid-row: 2; }
  .tof-grids {
    display: flex;
    gap: 12px;
    flex: 1;
    align-items: center;
    justify-content: center;
  }
  .tof-grid-wrap { text-align: center; }
  .tof-label { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }
  canvas.tof { border-radius: 4px; image-rendering: pixelated; }
</style>
<!-- protobuf.js — lightweight decoder for binary WS messages -->
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7/dist/light/protobuf.min.js"></script>
</head>
<body>

<header>
  <h1>AutoBoat</h1>
  <div id="status-dot"></div>
  <span id="status-label">disconnected</span>
  <span id="msg-rate" style="margin-left:auto; color:var(--dim); font-size:11px;"></span>
</header>

<div class="grid">

  <!-- Camera -->
  <div class="card" id="camera-card">
    <div class="card-title">Camera — MJPEG Stream</div>
    <img id="cam-img" src="" alt="No stream" />
  </div>

  <!-- IMU -->
  <div class="card" id="imu-card">
    <div class="card-title">IMU — ICM20948</div>
    <div id="horizon-wrap">
      <canvas class="horizon" id="horizon" width="120" height="120"></canvas>
    </div>
    <div class="imu-vals">
      <div class="imu-val">
        <div class="imu-label">Pitch</div>
        <div class="imu-num" id="imu-pitch">—</div>
        <div class="imu-unit">deg</div>
      </div>
      <div class="imu-val">
        <div class="imu-label">Roll</div>
        <div class="imu-num" id="imu-roll">—</div>
        <div class="imu-unit">deg</div>
      </div>
      <div class="imu-val">
        <div class="imu-label">Heading</div>
        <div class="imu-num" id="imu-hdg">—</div>
        <div class="imu-unit">deg</div>
      </div>
    </div>
  </div>

  <!-- ToF -->
  <div class="card" id="tof-card">
    <div class="card-title">ToF — VL53L5CX 8x8</div>
    <div class="tof-grids">
      <div class="tof-grid-wrap">
        <div class="tof-label">Sensor A</div>
        <canvas class="tof" id="tof-a" width="8" height="8" style="width:120px;height:120px;"></canvas>
      </div>
      <div class="tof-grid-wrap">
        <div class="tof-label">Sensor B</div>
        <canvas class="tof" id="tof-b" width="8" height="8" style="width:120px;height:120px;"></canvas>
      </div>
    </div>
    <div id="tof-range-label" style="text-align:center;font-size:10px;color:var(--dim);">0 mm — 2000 mm</div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

// ── Proto schema (matches boat.proto) ───────────────────────
const protoSchema = `
syntax = "proto3";
package boat;

message IMUData {
  float pitch   = 1;
  float roll    = 2;
  float heading = 3;
}

message ToFGrid {
  bool           valid     = 1;
  repeated int32 distances = 2;
}

message SensorSnapshot {
  uint64  timestamp_us = 1;
  IMUData imu          = 2;
  ToFGrid tof_a        = 3;
  ToFGrid tof_b        = 4;
}

message MotorCommand {
  float throttle = 1;
  float rudder   = 2;
}

message SystemStatus {
  uint32 heap_free = 1;
  int32  wifi_rssi = 2;
  uint64 uptime_us = 3;
}

message BoatMessage {
  oneof payload {
    SensorSnapshot sensors = 1;
    MotorCommand   motor   = 2;
    SystemStatus   status  = 3;
  }
}
`;

const root = protobuf.parse(protoSchema).root;
const BoatMessage = root.lookupType('boat.BoatMessage');

// ── Camera stream (separate MJPEG on port 81) ──────────────
function startStream() {
  const host = window.location.hostname || '192.168.1.201';
  $('cam-img').src = `http://${host}:81/stream`;
}

// ── WebSocket connection ────────────────────────────────────
let ws = null;
let msgCount = 0, lastRateTime = Date.now();
let reconnectTimer = null;

function connectWS() {
  const host = window.location.host || '192.168.1.201';
  ws = new WebSocket(`ws://${host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    $('status-dot').className = 'ok';
    $('status-label').textContent = 'connected';
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = (evt) => {
    msgCount++;
    try {
      const msg = BoatMessage.decode(new Uint8Array(evt.data));
      if (msg.sensors) {
        const s = msg.sensors;
        if (s.imu) {
          $('imu-pitch').textContent = s.imu.pitch.toFixed(1);
          $('imu-roll').textContent  = s.imu.roll.toFixed(1);
          $('imu-hdg').textContent   = s.imu.heading.toFixed(1);
          drawHorizon(s.imu.pitch, s.imu.roll);
        }
        if (s.tofA) drawTof('tof-a', s.tofA);
        if (s.tofB) drawTof('tof-b', s.tofB);
      }
    } catch (e) {
      console.error('Decode error:', e);
    }
  };

  ws.onclose = () => {
    $('status-dot').className = 'err';
    $('status-label').textContent = 'disconnected';
    reconnectTimer = setTimeout(connectWS, 2000);
  };

  ws.onerror = () => { ws.close(); };
}

// Send motor command (for future use)
function sendMotor(throttle, rudder) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const msg = BoatMessage.create({ motor: { throttle, rudder } });
  ws.send(BoatMessage.encode(msg).finish());
}

// ── Message rate counter ────────────────────────────────────
setInterval(() => {
  const now = Date.now();
  const rate = msgCount / ((now - lastRateTime) / 1000);
  $('msg-rate').textContent = `${rate.toFixed(1)} msg/s`;
  msgCount = 0;
  lastRateTime = now;
}, 2000);

// ── Horizon indicator ───────────────────────────────────────
function drawHorizon(pitch, roll) {
  const c = $('horizon');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height, cx = w/2, cy = h/2, r = w/2 - 2;

  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.clip();

  ctx.translate(cx, cy);
  ctx.rotate(roll * Math.PI / 180);

  const offset = Math.max(-r, Math.min(r, pitch * 2));

  ctx.fillStyle = '#001A33';
  ctx.fillRect(-r, -r, r*2, r + offset);

  ctx.fillStyle = '#2D1A00';
  ctx.fillRect(-r, offset, r*2, r*2);

  ctx.strokeStyle = '#FFB300';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-r, offset);
  ctx.lineTo(r, offset);
  ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = '#00BFFF';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx-12, cy); ctx.lineTo(cx+12, cy);
  ctx.moveTo(cx, cy-12); ctx.lineTo(cx, cy+12);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = '#1A2A44';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ── ToF heatmap ─────────────────────────────────────────────
const MAX_MM = 2000;

function distToColor(mm) {
  if (!mm || mm <= 0) return [20, 20, 20];
  const t = Math.min(mm, MAX_MM) / MAX_MM;
  const stops = [
    [255, 0,   0  ],
    [255, 180, 0  ],
    [0,   255, 80 ],
    [0,   200, 255],
    [0,   60,  200],
  ];
  const scaled = t * (stops.length - 1);
  const i = Math.floor(scaled);
  const f = scaled - i;
  const a = stops[Math.min(i, stops.length-1)];
  const b = stops[Math.min(i+1, stops.length-1)];
  return [
    Math.round(a[0] + (b[0]-a[0]) * f),
    Math.round(a[1] + (b[1]-a[1]) * f),
    Math.round(a[2] + (b[2]-a[2]) * f),
  ];
}

function drawTof(canvasId, tofGrid) {
  const c = $(canvasId);
  const ctx = c.getContext('2d');
  if (!tofGrid || !tofGrid.valid || !tofGrid.distances || tofGrid.distances.length < 64) {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, 8, 8);
    return;
  }
  const img = ctx.createImageData(8, 8);
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const mm = tofGrid.distances[row * 8 + col];
      const [r, g, b] = distToColor(mm);
      const idx = (row * 8 + col) * 4;
      img.data[idx]   = r;
      img.data[idx+1] = g;
      img.data[idx+2] = b;
      img.data[idx+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ── Init ────────────────────────────────────────────────────
drawHorizon(0, 0);
drawTof('tof-a', null);
drawTof('tof-b', null);
startStream();
connectWS();
</script>
</body>
</html>
